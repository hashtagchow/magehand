# JVM args for the Gradle daemon. 4g is enough for a 4-module Compose build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache ON since WP8's toolchain bump (AGP 9.3.1 + Hilt 2.60.1).
# WP1 had to leave it off because the Hilt Gradle plugin tripped it; that is fixed
# — see docs/verification/WP8.md §1.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
